<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana özel sevgilim ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #8b174b;
  text-align: center;
  background: linear-gradient(135deg, #ffe0ed, #ffc1d9, #fff0f6);
  overflow-x: hidden;
}

.screen {
  min-height: 100vh;
  padding: 45px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 { font-size: clamp(28px, 7vw, 42px); }

.message {
  max-width: 550px;
  font-size: 20px;
  line-height: 1.8;
}

.heart {
  font-size: 110px;
  animation: beat 1s infinite;
  filter: drop-shadow(0 8px 16px #e94c87);
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

button {
  border: none;
  border-radius: 30px;
  padding: 16px 24px;
  margin-top: 25px;
  background: #e84383;
  color: white;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 5px 15px #d65b8b66;
}

button:active { transform: scale(.97); }

#second { display: none; }

.languages {
  width: 100%;
  max-width: 650px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
  margin-top: 20px;
}

.language {
  background: #ffffffa8;
  padding: 15px 8px;
  border-radius: 16px;
  box-shadow: 0 3px 12px #d75d8a22;
  font-size: 17px;
}

.language small {
  display: block;
  color: #b13d70;
  margin-bottom: 7px;
  font-family: Arial, sans-serif;
}

.floating {
  position: fixed;
  bottom: -30px;
  animation: floatUp 7s linear infinite;
  pointer-events: none;
  z-index: -1;
}

@keyframes floatUp {
  to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
}
</style>
</head>
<body>

<section id="first" class="screen">
  <h1>Sana özel sevgilim ❤️</h1>

  <p class="message">
    Senin için kendi ellerimle yaptım bu kalbi
    çünkü kalbimin en güzel yeri sensin ❤️
  </p>

  <div class="heart">♥</div>

  <h2>Seni çok seviyorum 💗</h2>

  <button onclick="showLanguages()">
    Dünyadaki bütün dillerde seni seviyorum 🌍❤️
  </button>
</section>

<section id="second" class="screen">
  <h1>Seni her dilde seviyorum ❤️🌍</h1>
  <p class="message">
    Dünyada kaç dil varsa, kalbimde sana olan sevgim hepsinden büyük 💗
  </p>

  <div class="languages" id="languages"></div>

  <p class="message">Benim en güzel kelimem sensin ❤️</p>

  <button onclick="showFirst()">Kalbime geri dön ❤️</button>
</section>

<script>
const words = [
  ["Türkçe", "Seni seviyorum ❤️"],
  ["İngilizce", "I love you ❤️"],
  ["Almanca", "Ich liebe dich ❤️"],
  ["Fransızca", "Je t’aime ❤️"],
  ["İspanyolca", "Te amo ❤️"],
  ["İtalyanca", "Ti amo ❤️"],
  ["Portekizce", "Eu te amo ❤️"],
  ["Hollandaca", "Ik hou van jou ❤️"],
  ["İsveççe", "Jag älskar dig ❤️"],
  ["Norveççe", "Jeg elsker deg ❤️"],
  ["Danca", "Jeg elsker dig ❤️"],
  ["Fince", "Rakastan sinua ❤️"],
  ["Lehçe", "Kocham cię ❤️"],
  ["Çekçe", "Miluji tě ❤️"],
  ["Romence", "Te iubesc ❤️"],
  ["Yunanca", "Σ' αγαπώ ❤️"],
  ["Rusça", "Я тебя люблю ❤️"],
  ["Ukraynaca", "Я тебе кохаю ❤️"],
  ["Arapça", "أحبك ❤️"],
  ["Farsça", "دوستت دارم ❤️"],
  ["Japonca", "愛してる ❤️"],
  ["Korece", "사랑해 ❤️"],
  ["Çince", "我爱你 ❤️"],
  ["Hintçe", "मैं तुमसे प्यार करता हूँ ❤️"],
  ["Bengalce", "আমি তোমাকে ভালোবাসি ❤️"],
  ["Urduca", "میں تم سے پیار کرتا ہوں ❤️"],
  ["Tayca", "ฉันรักคุณ ❤️"],
  ["Vietnamca", "Anh yêu em ❤️"],
  ["Endonezce", "Aku cinta kamu ❤️"],
  ["Filipince", "Mahal kita ❤️"],
  ["İbranice", "אני אוהב אותך ❤️"],
  ["Svahili", "Nakupenda ❤️"],
  ["Ermenice", "Ես քեզ սիրում եմ ❤️"],
  ["Gürcüce", "მიყვარხარ ❤️"],
  ["Azerbaycanca", "Mən səni sevirəm ❤️"],
  ["Kürtçe (Kurmancî)", "Ez ji te hez dikim ❤️"],
  ["Latince", "Te amo ❤️"],
  ["Esperanto", "Mi amas vin ❤️"],
  ["İzlandaca", "Ég elska þig ❤️"],
  ["Macarca", "Szeretlek ❤️"],
  ["Hırvatça", "Volim te ❤️"],
  ["Sırpça", "Волим те ❤️"],
  ["Bulgarca", "Обичам те ❤️"],
  ["Slovakça", "Ľúbim ťa ❤️"],
  ["Litvanca", "Aš tave myliu ❤️"],
  ["Letonca", "Es tevi mīlu ❤️"],
  ["Estonca", "Ma armastan sind ❤️"],
  ["Malta dili", "Inħobbok ❤️"],
  ["İrlandaca", "Tá grá agam duit ❤️"],
  ["Galce", "Rwy'n dy garu di ❤️"],
  ["Nepalce", "म तिमीलाई माया गर्छु ❤️"]
];

const container = document.getElementById("languages");

words.forEach(([language, phrase]) => {
  const card = document.createElement("div");
  card.className = "language";

  const name = document.createElement("small");
  name.textContent = language;

  const text = document.createElement("div");
  text.textContent = phrase;

  card.append(name, text);
  container.appendChild(card);
});

function showLanguages() {
  document.getElementById("first").style.display = "none";
  document.getElementById("second").style.display = "flex";
  window.scrollTo(0, 0);
}

function showFirst() {
  document.getElementById("second").style.display = "none";
  document.getElementById("first").style.display = "flex";
  window.scrollTo(0, 0);
}

for (let i = 0; i < 16; i++) {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.textContent = ["💗", "💕", "💖", "❤️"][i % 4];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDelay = Math.random() * 7 + "s";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
