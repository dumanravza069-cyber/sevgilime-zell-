

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Seviyorum ♡</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: radial-gradient(ellipse at center,
    #714451 0%, #482832 52%, #24171e 100%);
  color: #f0c5d2;
  font-family: Georgia, serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#message {
  position: fixed;
  bottom: 18px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 13px;
  letter-spacing: 2px;
  color: #d9a5b6;
  opacity: .85;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="heart"></canvas>
<div id="message">HER DİLDE, HER ZAMAN SENİ SEVİYORUM ♡</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const pinks = [
  "#f3d3de",
  "#e7b3c5",
  "#d99aaf",
  "#efc1d0",
  "#c9859e",
  "#f5dce4"
];

const words = [
  "Seni seviyorum ♡",
  "I love you ♡",
  "Je t’aime ♡",
  "Te amo ♡",
  "Ti amo ♡",
  "Ich liebe dich ♡",
  "Eu te amo ♡",
  "Я тебя люблю ♡",
  "愛してる ♡",
  "사랑해 ♡",
  "我爱你 ♡",
  "أحبك ♡",
  "Σ’ αγαπώ ♡",
  "دوستت دارم ♡",
  "Seni çok seviyorum ♡",
  "Mon amour ♡"
];

let W, H, dpr, start;
let points = [];

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const scale = Math.min(W / 36, H / 34, 13);
  points = [];

  for (let i = 0; i < 180; i++) {
    const t = (i / 180) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t);

    points.push({
      x: x * scale,
      y: -y * scale,
      color: pinks[i % pinks.length]
    });
  }
}

function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
    - 5 * Math.cos(2 * t)
    - 2 * Math.cos(3 * t)
    - Math.cos(4 * t);

  return { x: x * scale, y: -y * scale };
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2 - 8;
  const scale = Math.min(W / 36, H / 34, 13);
  const elapsed = (time - start) / 1000;

  ctx.save();
  ctx.translate(cx, cy);

  // Kalp yavaşça nefes alır
  const pulse = 1 + Math.sin(elapsed * 1.7) * 0.018;
  ctx.scale(pulse, pulse);

  // Kalbin çizgileri sırayla oluşur
  const progress = Math.min(1, elapsed / 4.5);
  const count = Math.floor(progress * points.length);

  for (let i = 0; i < count; i++) {
    const p = points[i];
    const fade = 0.55 + 0.35 *
      Math.sin(elapsed * 1.3 + i * 0.13);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = Math.max(0.25, fade);
    ctx.lineWidth = 0.65;
    ctx.stroke();
  }

  ctx.globalAlpha = 1;

  // Kalbin dış çizgisi
  ctx.beginPath();
  for (let i = 0; i <= 240; i++) {
    const p = heartPoint((i / 240) * Math.PI * 2, scale);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.strokeStyle = "#efc6d4";
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 1.15;
  ctx.stroke();

  // Kalbin içindeki yazı
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#f6dce4";
  ctx.shadowColor = "#e7b3c5";
  ctx.shadowBlur = 12;
  ctx.font = "bold 15px Georgia, serif";
  ctx.fillText("SENİ SEVİYORUM", 0, 8);
  ctx.shadowBlur = 0;

  ctx.restore();

  // Farklı dillerde sevgi sözleri kalbin çevresinde
  const radius = Math.min(W * 0.43, H * 0.42);
  const wordAlpha = 0.72 + Math.sin(elapsed * 1.1) * 0.15;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "12px Georgia, serif";
  ctx.fillStyle = "#efc5d3";
  ctx.globalAlpha = wordAlpha;

  words.forEach((word, i) => {
    const angle = (i / words.length) * Math.PI * 2
      - Math.PI / 2;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    ctx.fillText(word, x, y);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);
resize();
start = performance.now();
requestAnimationFrame(draw);
</script>
</body>
</html>
